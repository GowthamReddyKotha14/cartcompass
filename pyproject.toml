[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cartcompass"
version = "0.1.0"
description = "Find the real cheapest grocery near you: unit prices across nearby stores, from live store data."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
# Free on-device receipt OCR on macOS (Apple Vision). Tesseract also works if installed.
mac = ["pyobjc-framework-Vision>=10"]

[project.scripts]
cartcompass = "cartcompass.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
# Only the app itself is the package; data/ (local price history) and scripts/ are not.
packages = ["cartcompass"]
